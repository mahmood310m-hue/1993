
name: Repair Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Backup Android folder
        run: |
          if [ -d android ]; then
            cp -a android /tmp/android-backup
          fi

      - name: Regenerate Android platform
        run: |
          flutter create --platforms=android .

      - name: Check generated files
        run: |
          test -f android/app/build.gradle
          test -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml

      - name: Commit repaired Android files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "Repair Android platform structure" || echo "No changes"
          git push
