
name: Build Kauthar School APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # تحميل المشروع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # تثبيت Flutter بإصدار حديث
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # التحقق من إصدارات Flutter و Dart
      - name: Check Flutter and Dart
        run: |
          flutter --version
          dart --version

      # تثبيت الحزم
      - name: Get Dependencies
        run: flutter pub get

      # فحص المشروع
      - name: Analyze Project
        run: flutter analyze
        continue-on-error: true

      # بناء APK
      - name: Build Release APK
        run: flutter build apk --release

      # حفظ ملف APK كملف قابل للتنزيل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kauthar-School-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
