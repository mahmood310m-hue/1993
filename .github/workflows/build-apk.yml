
name: Build Kauthar School APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل ملفات المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت Flutter بإصدار مستقر حديث
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. عرض إصدارات Flutter و Dart
      - name: Check Flutter and Dart
        run: |
          flutter --version
          dart --version

      # 4. تثبيت الحزم
      - name: Get dependencies
        run: flutter pub get

      # 5. تنظيف المشروع
      - name: Clean project
        run: flutter clean

      # 6. إعادة تثبيت الحزم
      - name: Get dependencies again
        run: flutter pub get

      # 7. إنشاء APK
      - name: Build Release APK
        run: flutter build apk --release

      # 8. حفظ ملف APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kauthar-School-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
