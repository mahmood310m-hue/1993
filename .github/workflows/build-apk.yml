
name: Build Kauthar School APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kauthar School APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install exact Flutter version
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: false

      # Verify Dart before any dependency installation
      - name: Verify Dart SDK
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          dart --version 2>&1 | grep -Eq 'Dart SDK version: 3\.(1[3-9]|[2-9][0-9])\.'

      # Generate fresh Android project
      - name: Create Android Project
        run: |
          flutter create \
            --platforms=android \
            --org com.kauthar.school \
            --project-name kauthar_school \
            fresh_app

      # Copy application files
      - name: Copy Application
        run: |
          cp -a lib fresh_app/
          cp pubspec.yaml fresh_app/

          if [ -f pubspec.lock ]; then
            cp pubspec.lock fresh_app/
          fi

          if [ -f analysis_options.yaml ]; then
            cp analysis_options.yaml fresh_app/
          fi

          if [ -d assets ]; then
            cp -a assets fresh_app/
          fi

      # Install dependencies using verified SDK
      - name: Get Dependencies
        working-directory: fresh_app
        run: flutter pub get

      # Build APK
      - name: Build Release APK
        working-directory: fresh_app
        run: flutter build apk --release

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kauthar-School-APK
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
