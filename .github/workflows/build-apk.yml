
name: Build Kauthar School APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kauthar School APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Flutter with Dart 3.13.7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # Verify SDK
      - name: Check Flutter and Dart
        run: |
          flutter --version
          dart --version

      # Generate missing Android files
      - name: Generate Android Platform
        run: |
          flutter create \
            --platforms=android \
            --org com.kauthar.school \
            --project-name kauthar_school .

      # Install dependencies
      - name: Get Dependencies
        run: flutter pub get

      # Build APK
      - name: Build Release APK
        run: flutter build apk --release

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kauthar-School-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
