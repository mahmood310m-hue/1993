
name: Build Kauthar School APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kauthar School APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download project
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # 3. Verify Dart SDK
      - name: Check Flutter and Dart
        run: |
          flutter --version
          dart --version
          dart --version 2>&1 | grep -E 'Dart SDK version: 3\.(1[3-9]|[2-9][0-9])\.'

      # 4. Create a fresh Flutter project
      - name: Create Fresh Android Project
        run: |
          flutter create \
            --platforms=android \
            --org com.kauthar.school \
            --project-name kauthar_school \
            fresh_app

      # 5. Copy application source files
      - name: Copy Existing Application
        run: |
          cp -a lib fresh_app/
          cp pubspec.yaml fresh_app/

          if [ -f pubspec.lock ]; then
            cp pubspec.lock fresh_app/
          fi

          if [ -f analysis_options.yaml ]; then
            cp analysis_options.yaml fresh_app/
          fi

          if [ -d assets ]; then
            cp -a assets fresh_app/
          fi

          if [ -d fonts ]; then
            cp -a fonts fresh_app/
          fi

          if [ -d images ]; then
            cp -a images fresh_app/
          fi

      # 6. Install dependencies
      - name: Get Dependencies
        working-directory: fresh_app
        run: flutter pub get

      # 7. Analyze project
      - name: Analyze Project
        working-directory: fresh_app
        run: flutter analyze
        continue-on-error: true

      # 8. Build release APK
      - name: Build Release APK
        working-directory: fresh_app
        run: flutter build apk --release

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kauthar-School-APK
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
