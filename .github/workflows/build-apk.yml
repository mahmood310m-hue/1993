
name: Build Kauthar School APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: false

      - name: Verify Flutter Installation
        run: |
          which flutter
          which dart
          flutter --version
          dart --version
          dart --version | grep '3.13'

      - name: Generate Android Files
        run: |
          flutter create --platforms=android --org com.kauthar.school --project-name kauthar_school .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kauthar-School-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
