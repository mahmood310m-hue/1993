
name: Rebuild Android Platform

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter project
        run: |
          test -f pubspec.yaml
          flutter --version

      - name: Recreate Android platform
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: Verify Android files
        run: |
          echo "Checking Android structure..."
          test -f android/app/build.gradle
          test -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml
          find android/app/src/main -type f

      - name: Save generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android
          git commit -m "Regenerate Android platform files" || true
          git push
